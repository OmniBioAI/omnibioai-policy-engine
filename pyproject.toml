[build-system]
requires = ["setuptools>=61", "wheel", "Cython==3.1.6"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibioai-policy-engine"
version = "0.1.2"
description = "Authorization policy engine for the OmniBioAI ecosystem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.8,<3",
    "pydantic>=2.10,<3",
    "redis>=5,<9",
    "starlette>=0.46,<1",
    "swagger-ui-bundle>=1.1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "fakeredis>=2.25,<3",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
